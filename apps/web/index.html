<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoardDream</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // The theme before the first paint (theme.ts keeps it after): the player's pick, else the system's.
      try {
        const picked = localStorage.getItem("boarddream.theme");
        const dark = picked ? picked === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
