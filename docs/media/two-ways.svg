<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 820" role="img" aria-labelledby="t d">
  <title id="t">Two ways to make a board game</title>
  <desc id="d">The old way loops through writing rules, a paper prototype and a playtest night, a week a lap, for weeks. BoardDream goes from one sentence through Muse Spark, tested mechanics, rules as code and a thousand bot games, fixing anything that breaks, to a game you play tonight.</desc>
  <style>
    .eyebrow { font: 600 22px system-ui, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.22em; fill: var(--stroke); }
    .label { font: 500 28px system-ui, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); text-anchor: middle; }
    .pill-label { font: 650 22px system-ui, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.14em; fill: var(--text); text-anchor: middle; }
    .note { font: italic 400 30px Georgia, "Times New Roman", serif; fill: var(--text); }
    .after { font: italic 500 40px Georgia, "Times New Roman", serif; fill: var(--text); }
    .dream .pill-label, .dream .note, .dream .after { fill: #f0cf86; }
    .flow { stroke-dasharray: 10 10; }
    @media (prefers-reduced-motion: no-preference) {
      .flow { animation: dashmove 0.75s linear infinite; }
      .flow.slow { animation-duration: 2.4s; }
    }
    @keyframes dashmove { to { stroke-dashoffset: -20; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#211912" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="820" rx="24" fill="#120d0a"/>
  <rect x="0" y="0" width="1920" height="820" rx="24" fill="url(#grid)"/>
    <g class="old" style="--stroke:#8a7d69;--text:#bfb19b">
      <text x="90" y="74" class="eyebrow">THE OLD WAY</text>
    <g stroke="#8a7d69" stroke-width="2" fill="none">
      <path class="flow slow" d="M266 180 H405" marker-end="url(#arrow)"/>
      <path class="flow slow" d="M671 180 H810" marker-end="url(#arrow)"/>
      <path class="flow slow" d="M1022 180 H1160" marker-end="url(#arrow)"/>
      <path class="flow slow" d="M1412 180 H1551" marker-end="url(#arrow)"/>
      <path class="flow slow" d="M1288 234 V290 H540 V238" marker-end="url(#arrow)"/>
    </g>
    <g fill="#d9ccb6">
      <circle r="7" class="dot" opacity="0"><animateMotion id="old_dot_0" dur="1.1s" begin="0s;old_dot_4.end+0.6s" fill="freeze" path="M266 180 L405 180"/><set attributeName="opacity" to="1" begin="old_dot_0.begin" end="old_dot_0.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="old_dot_1" dur="1.1s" begin="old_dot_0.end" fill="freeze" path="M671 180 L810 180"/><set attributeName="opacity" to="1" begin="old_dot_1.begin" end="old_dot_1.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="old_dot_2" dur="1.1s" begin="old_dot_1.end" fill="freeze" path="M1022 180 L1160 180"/><set attributeName="opacity" to="1" begin="old_dot_2.begin" end="old_dot_2.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="old_dot_3" dur="1.1s" begin="old_dot_2.end" fill="freeze" path="M1288 234 L1288 290 L540 290 L540 238"/><set attributeName="opacity" to="1" begin="old_dot_3.begin" end="old_dot_3.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="old_dot_4" dur="1.1s" begin="old_dot_3.end" fill="freeze" path="M1412 180 L1551 180"/><set attributeName="opacity" to="1" begin="old_dot_4.begin" end="old_dot_4.end"/></circle>
    </g>
      <rect x="90" y="146" width="176" height="68" rx="34" fill="#120d0a"/><rect x="90" y="146" width="176" height="68" rx="34" fill="rgba(191,177,155,0.05)" stroke="#8a7d69" stroke-width="2.5"/><text x="178" y="187.92" class="pill-label">AN IDEA</text>
      <rect x="409" y="126" width="262" height="108" rx="14" fill="#120d0a"/><rect x="409" y="126" width="262" height="108" rx="14" fill="rgba(191,177,155,0.05)" stroke="#8a7d69" stroke-width="2"/><text x="540" y="172.08" class="label">Write the rules</text><text x="540" y="208.08" class="label">by hand</text>
      <rect x="814" y="126" width="208" height="108" rx="14" fill="#120d0a"/><rect x="814" y="126" width="208" height="108" rx="14" fill="rgba(191,177,155,0.05)" stroke="#8a7d69" stroke-width="2"/><text x="918" y="172.08" class="label">Cut a paper</text><text x="918" y="208.08" class="label">prototype</text>
      <rect x="1164" y="126" width="248" height="108" rx="14" fill="#120d0a"/><rect x="1164" y="126" width="248" height="108" rx="14" fill="rgba(191,177,155,0.05)" stroke="#8a7d69" stroke-width="2"/><text x="1288" y="172.08" class="label">Wait for a</text><text x="1288" y="208.08" class="label">playtest night</text>
      <rect x="1555" y="146" width="275" height="68" rx="34" fill="#120d0a"/><rect x="1555" y="146" width="275" height="68" rx="34" fill="rgba(191,177,155,0.05)" stroke="#8a7d69" stroke-width="2.5"/><text x="1692.5" y="187.92" class="pill-label">FINALLY, PLAY</text>
      <text x="914" y="336" text-anchor="middle" class="note">Not fun yet? Rewrite it, and wait a week.</text>
      <text x="1692.5" y="116" text-anchor="middle" class="after">weeks later</text>
    </g>
    <g class="dream" style="--stroke:#d9a441;--text:#f5ecdc">
      <text x="90" y="424" class="eyebrow">WITH BOARDDREAM</text>
    <g stroke="#d9a441" stroke-width="2" fill="none">
      <path class="flow" d="M348 530 H417" marker-end="url(#arrow)"/>
      <path class="flow" d="M615 530 H684" marker-end="url(#arrow)"/>
      <path class="flow" d="M909 530 H979" marker-end="url(#arrow)"/>
      <path class="flow" d="M1218 530 H1287" marker-end="url(#arrow)"/>
      <path class="flow" d="M1499 530 H1568" marker-end="url(#arrow)"/>
      <path class="flow" d="M1349 584 V664" marker-end="url(#arrow)"/>
      <path class="flow" d="M1441 668 V588" marker-end="url(#arrow)"/>
    </g>
    <g fill="#f0cf86">
      <circle r="7" class="dot" opacity="0"><animateMotion id="dream_dot_0" dur="0.45s" begin="0s;dream_dot_6.end+0.6s" fill="freeze" path="M348 530 L417 530"/><set attributeName="opacity" to="1" begin="dream_dot_0.begin" end="dream_dot_0.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="dream_dot_1" dur="0.45s" begin="dream_dot_0.end" fill="freeze" path="M615 530 L684 530"/><set attributeName="opacity" to="1" begin="dream_dot_1.begin" end="dream_dot_1.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="dream_dot_2" dur="0.45s" begin="dream_dot_1.end" fill="freeze" path="M909 530 L979 530"/><set attributeName="opacity" to="1" begin="dream_dot_2.begin" end="dream_dot_2.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="dream_dot_3" dur="0.45s" begin="dream_dot_2.end" fill="freeze" path="M1218 530 L1287 530"/><set attributeName="opacity" to="1" begin="dream_dot_3.begin" end="dream_dot_3.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="dream_dot_4" dur="0.45s" begin="dream_dot_3.end" fill="freeze" path="M1349 584 L1349 664"/><set attributeName="opacity" to="1" begin="dream_dot_4.begin" end="dream_dot_4.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="dream_dot_5" dur="0.45s" begin="dream_dot_4.end" fill="freeze" path="M1441 668 L1441 588"/><set attributeName="opacity" to="1" begin="dream_dot_5.begin" end="dream_dot_5.end"/></circle>
      <circle r="7" class="dot" opacity="0"><animateMotion id="dream_dot_6" dur="0.45s" begin="dream_dot_5.end" fill="freeze" path="M1499 530 L1568 530"/><set attributeName="opacity" to="1" begin="dream_dot_6.begin" end="dream_dot_6.end"/></circle>
    </g>
      <rect x="90" y="496" width="258" height="68" rx="34" fill="#120d0a"/><rect x="90" y="496" width="258" height="68" rx="34" fill="rgba(217,164,65,0.08)" stroke="#d9a441" stroke-width="2.5"/><text x="219" y="537.92" class="pill-label">ONE SENTENCE</text>
      <rect x="421" y="476" width="194" height="108" rx="14" fill="#120d0a"/><rect x="421" y="476" width="194" height="108" rx="14" fill="rgba(217,164,65,0.08)" stroke="#d9a441" stroke-width="2"/><text x="518" y="522.08" class="label">Muse Spark</text><text x="518" y="558.08" class="label">designs it</text>
      <rect x="688" y="476" width="221" height="108" rx="14" fill="#120d0a"/><rect x="688" y="476" width="221" height="108" rx="14" fill="rgba(217,164,65,0.08)" stroke="#d9a441" stroke-width="2"/><text x="798.5" y="522.08" class="label">Picks tested</text><text x="798.5" y="558.08" class="label">mechanics</text>
      <rect x="983" y="476" width="235" height="108" rx="14" fill="#120d0a"/><rect x="983" y="476" width="235" height="108" rx="14" fill="rgba(217,164,65,0.08)" stroke="#d9a441" stroke-width="2"/><text x="1100.5" y="522.08" class="label">Writes the</text><text x="1100.5" y="558.08" class="label">rules as code</text>
      <rect x="1291" y="476" width="208" height="108" rx="14" fill="#120d0a"/><rect x="1291" y="476" width="208" height="108" rx="14" fill="rgba(217,164,65,0.08)" stroke="#d9a441" stroke-width="2"/><text x="1395" y="522.08" class="label">Bots play</text><text x="1395" y="558.08" class="label">1,000 games</text>
      <rect x="1572" y="496" width="258" height="68" rx="34" fill="#120d0a"/><rect x="1572" y="496" width="258" height="68" rx="34" fill="rgba(217,164,65,0.08)" stroke="#d9a441" stroke-width="2.5"/><text x="1701" y="537.92" class="pill-label">PLAY TONIGHT</text>
      <rect x="1298" y="668" width="194" height="108" rx="14" fill="#120d0a"/><rect x="1298" y="668" width="194" height="108" rx="14" fill="rgba(217,164,65,0.08)" stroke="#d9a441" stroke-width="2"/><text x="1395" y="714.08" class="label">Muse Spark</text><text x="1395" y="750.08" class="label">fixes it</text>
      <text x="1331" y="636" text-anchor="end" class="note">if it breaks</text>
      <text x="1459" y="636" text-anchor="start" class="note">test again</text>
      <text x="1701" y="466" text-anchor="middle" class="after">minutes later</text>
    </g>
</svg>
